<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      The start loader. The browser paints it from this page alone, before any script has arrived,
      and src/navigation/startLoader.web.ts removes it once the first screen is up. It is the
      phone app's splash: the mark on brand black (colors.black, colors.lime and
      colors.onBlackDivider in @finvest/tokens). The app's own font is not loaded yet, so the page
      has no words except the note for a slow start.
    -->
    <style id="finvest-start-style">
      #finvest-start {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0d0d0d;
        transition: opacity 180ms ease-out;
      }
      #finvest-start[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      #finvest-start .mark {
        width: 72px;
        height: 72px;
        animation: finvest-breathe 1.6s ease-in-out infinite;
      }
      #finvest-start .track {
        position: relative;
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: #333333;
      }
      #finvest-start .track::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #b6eb0a;
        animation: finvest-sweep 1.1s ease-in-out infinite;
      }
      #finvest-start .slow {
        position: absolute;
        bottom: 15%;
        left: 24px;
        right: 24px;
        margin: 0;
        text-align: center;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #c9c9c4;
        opacity: 0;
        /* Shown only if the app has not started after 15 seconds. */
        animation: finvest-show 0s linear 15s forwards;
      }
      #finvest-start .slow a {
        color: #b6eb0a;
      }
      @keyframes finvest-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @keyframes finvest-breathe {
        50% {
          transform: scale(0.94);
        }
      }
      @keyframes finvest-show {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #finvest-start {
          transition: none;
        }
        #finvest-start .mark {
          animation: none;
        }
        #finvest-start .track::after {
          left: 30%;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="finvest-start" role="progressbar" aria-label="Opening Finvest" aria-busy="true">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="18" fill="#222222" />
        <path
          d="M14 44l11-12 9 8 9-11"
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="49" cy="20" r="6.5" fill="#b6eb0a" />
      </svg>
      <div class="track"></div>
      <p class="slow">This is taking longer than usual. Check your connection, or <a href="">reload the page</a>.</p>
    </div>
  </body>
</html>
