name: Backend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.11.32"
jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make bootstrap
      - run: make check-backend
      - run: make audit

  integration:
    # The suite is split by test file into shards, each with its own throwaway database,
    # so no single job runs long enough to hit its time limit. Files are dealt out in
    # sorted order, so every file lands in exactly one shard.
    name: Integration tests on PostgreSQL, part ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
        env:
          # A throwaway database that lives for this job only.
          POSTGRES_PASSWORD: ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FINVEST_TEST_ADMIN_URL: postgresql://postgres:ci-admin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: psql --version
      - run: make bootstrap
      - name: Run this shard's integration test files
        working-directory: backend
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          mapfile -t files < <(find tests/integration -name 'test_*.py' | LC_ALL=C sort \
            | awk -v shard="$SHARD" -v shards="$SHARDS" 'NR % shards == shard % shards')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Shard $SHARD has no test files" >&2
            exit 1
          fi
          printf 'Shard %s runs %s files\n' "$SHARD" "${#files[@]}"
          uv run --locked pytest -m integration "${files[@]}"

  integration-result:
    # One stable check name for branch protection, whatever the number of shards.
    name: Integration tests on PostgreSQL
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.integration.result }}
        run: |
          echo "Integration shards: $RESULT"
          [ "$RESULT" = "success" ]

  journeys:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
        env:
          # A throwaway database that lives for this job only.
          POSTGRES_PASSWORD: ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FINVEST_TEST_ADMIN_URL: postgresql://postgres:ci-admin@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: make bootstrap
      - run: make test-journeys

  stack:
    name: Image build and Compose health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make test-stack
      - if: failure()
        run: docker compose logs --no-color --tail=200
