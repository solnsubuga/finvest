name: Client app

# Path filtered, so do not make this a required check as it stands: a PR that
# touches none of these paths would wait on it forever.

on:
  pull_request:
    paths:
      - "apps/client/**"
      - "packages/tokens/**"
      - "packages/api-client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/client.yml"
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "packages/tokens/**"
      - "packages/api-client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/client.yml"

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The generated API types match openapi.json
        working-directory: packages/api-client
        run: |
          pnpm check
          pnpm typecheck
      - name: Client app
        working-directory: apps/client
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build:web
      - name: A production build leaves the demos out
        working-directory: apps/client
        run: |
          # build:web above ran without EXPO_PUBLIC_DEMO_AUTH. The demo account
          # and its fixed code must not be anywhere in what it produced.
          if grep -rIl -e "correcthorse1" -e "Amara Nakato" dist; then
            echo "The demo sign-in was bundled into a production build" >&2
            exit 1
          fi
          # Nor the demo payments, which confirm payments that never happened.
          if grep -rIl -e "demo-91-day-bill" -e "FV-DEMO-" -e "Finvest Demo Client Account" dist; then
            echo "The demo payments were bundled into a production build" >&2
            exit 1
          fi
          # Nor the demo plans and insights, which show money that does not exist.
          if grep -rIl -e "stub-plan-" -e "demo-investment-1" dist; then
            echo "The demo plans or insights were bundled into a production build" >&2
            exit 1
          fi
          # Nor the demo goals, which show savings that were never made, nor any rate before
          # tax, which clients never see.
          if grep -rIl -e "School fees, Term 1" -e "demo-goal-" -e "taxBps" -e "annualRateBps" -e "before_tax" dist; then
            echo "The demo goals or a rate before tax were bundled into a production build" >&2
            exit 1
          fi
          # Nor the demo statements and receipts, which list documents that do not exist.
          if grep -rIl -e "demo-monthly-" -e "RC-Pq7Tz2Lm" dist; then
            echo "The demo documents were bundled into a production build" >&2
            exit 1
          fi
          # Nor the demo notifications and help chat, which show alerts and replies nobody sent.
          if grep -rIl -e "no one at Finvest has seen your message" -e "You earned UGX 2,416 today" dist; then
            echo "The demo notifications or help chat were bundled into a production build" >&2
            exit 1
          fi
