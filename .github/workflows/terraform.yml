name: Terraform

# Pull requests get format and validate only, with no credentials.
# Plans and applies run only by hand from main:
#   1. "Plan" runs in the <env>-plan environment, which holds read-only tokens.
#   2. "Apply" runs in the <env> environment, which holds the write tokens and waits for approval.
#      It plans again and refuses to apply if that plan differs from the one the approver read.
# Both environments must be limited to the main branch, so no other branch can reach their secrets.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan and apply"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  # Manual runs for one environment queue behind each other. PR checks hold no credentials.
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  check:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        run: |
          for env in staging production; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false
            terraform -chdir=infra/terraform/envs/$env validate
          done

  plan:
    name: Plan
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    outputs:
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_ssh_public_keys: ${{ vars.TF_SSH_PUBLIC_KEYS }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.TF_SSH_ALLOWED_CIDRS }}
      TF_VAR_admin_access_emails: ${{ vars.TF_ADMIN_ACCESS_EMAILS || '[]' }}
      TF_VAR_alert_emails: ${{ vars.TF_ALERT_EMAILS || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan ${{ inputs.environment }}
        id: plan
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: |
          terraform init -lockfile=readonly
          terraform plan -no-color -lock=false -out=tfplan
          {
            echo "### Terraform plan: ${{ inputs.environment }}"
            echo
            echo "Approve the apply only if this is what you expect. The apply stops if its own plan differs."
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "plan_hash=$(../../scripts/plan-hash.sh tfplan)" >> "$GITHUB_OUTPUT"

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment make every apply wait for approval.
    environment: ${{ inputs.environment }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_ssh_public_keys: ${{ vars.TF_SSH_PUBLIC_KEYS }}
      TF_VAR_ssh_allowed_cidrs: ${{ vars.TF_SSH_ALLOWED_CIDRS }}
      TF_VAR_admin_access_emails: ${{ vars.TF_ADMIN_ACCESS_EMAILS || '[]' }}
      TF_VAR_alert_emails: ${{ vars.TF_ALERT_EMAILS || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Apply ${{ inputs.environment }}
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        env:
          REVIEWED_PLAN_HASH: ${{ needs.plan.outputs.plan_hash }}
        run: |
          echo "Applying to ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          terraform init -lockfile=readonly
          terraform plan -no-color -out=tfplan
          hash=$(../../scripts/plan-hash.sh tfplan)
          if [ "$hash" != "$REVIEWED_PLAN_HASH" ]; then
            echo "The plan changed since it was reviewed. Run the workflow again and review the new plan." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          terraform apply -no-color tfplan

  print-lock:
    # Temporary: prints provider lock files so they can be committed. Removed before merge.
    name: Print provider lock files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: |
          for env in staging production; do
            cd infra/terraform/envs/$env
            terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=darwin_amd64 -platform=windows_amd64 >/dev/null
            echo "=====BEGIN $env"; cat .terraform.lock.hcl; echo "=====END $env"
            cd - >/dev/null
          done
