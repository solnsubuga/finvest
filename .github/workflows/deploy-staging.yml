name: Deploy Staging

# Deploys the head of `main` to staging (Reusable Deploy). Staging is on hold to save cost (the
# owner's decision, docs/decisions.md): this runs only when the repository variable
# STAGING_ENABLED is `true` and `staging` is listed in DEPLOY_ENVIRONMENTS. The `staging` GitHub
# environment's protection rules apply to every run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_recreate:
        description: Pass --force-recreate to Docker Compose
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true' &&
      contains(vars.DEPLOY_ENVIRONMENTS, 'staging')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      revision: ${{ github.sha }}
      force_recreate: ${{ inputs.force_recreate || false }}
    secrets: inherit
