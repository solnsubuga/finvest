name: Deploy Production

# Deploys the head of `release` to production (Reusable Deploy). The `release` branch is made from
# `main` only after Provision has applied production, so its existence is the switch. The `prod`
# GitHub environment's protection rules apply to every run.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      force_recreate:
        description: Pass --force-recreate to Docker Compose
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      revision: ${{ github.sha }}
      force_recreate: ${{ inputs.force_recreate || false }}
    secrets: inherit
